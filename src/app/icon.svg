<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96">
  <style>
    .ink { fill: #1c1917; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f5f5f4; }
    }
  </style>
  <mask id="k" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96" style="mask-type: alpha">
    <image width="96" height="96" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
