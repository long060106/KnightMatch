name: Daily KRSP scrape

on:
  schedule:
    # 11:17 UTC = 7:17 am in Orlando (EDT). Off the top of the hour, when GitHub's scheduler is busiest.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional. Set it only if Vercel does not redeploy after the data commit (see README).
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper
        run: pip install -r scraper/requirements.txt

      - name: Test the parser before touching the live site
        working-directory: scraper
        run: python -m pytest

      - name: Scrape KRSP (robots.txt checked, 2.5s between requests)
        working-directory: scraper
        env:
          SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
          SCRAPER_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m knightmatch_scraper

      - name: Make sure the new data has no emails and is consistent
        working-directory: scraper
        run: python -m pytest tests/test_privacy.py tests/test_data_files.py

      - name: Commit the new data
        id: commit
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Authored as the repo owner's GitHub noreply address: Vercel's Hobby plan only
          # deploys commits by the account owner, and no personal email is published.
          name="${{ github.repository_owner }}"
          email="${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git -c user.name="$name" -c user.email="$email" commit -m "data: KRSP update $(date -u +%Y-%m-%d)"
          git -c user.name="$name" -c user.email="$email" pull --rebase --autostash
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask Vercel to redeploy (only if a deploy hook is configured)
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
